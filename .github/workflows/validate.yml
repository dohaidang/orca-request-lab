name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - run: node --check ui/app.js
      - run: node --check ui/http-parser.js
      - run: node --check ui/request-tools.js
      - run: node --check ui/integration-tools.js
